# Voxelius world definitions. This file is YAML.
#
# Each key is a world name: it is also the directory under save/ that holds
# the world, and the terrain seed is derived from the name and the universe
# seed in save/universe.conf. Rename a world only by renaming the key and its
# directory together, otherwise it starts from scratch. Exactly one world
# should set default to true; without one the first world is used.
#
# Unknown keys are ignored. An invalid value logs a warning and falls back to
# the default.
#
# Biome and weather names are full identifiers and need their namespace:
# builtin:vox2_plains, mymod:custom_biome. A bare vox2_plains is rejected.
#
# The vox2 generator is a data-driven surface generator in the style of Minecraft
# 1.6-1.17: it reads these fields, the biome selector and the biome depth, scale and palettes

overworld:
  default: true
  generator: vox2
  min_y: -128
  max_y: 127
  spawn: [0, 64, 0]

  generator_settings:
    sea_level: 0
    surface_depth: 4
    snow_line: 48
    snow_temperature: 0.2
    density_factor: 1.0
    density_offset: -0.46875
    noise_amplitude: 1.0
    ocean_level: -0.18
    deep_ocean_level: -0.45
    river_width: 0.03
    ocean_depth: -1.0
    deep_ocean_depth: -1.8
    ocean_scale: 0.1
    river_depth: -0.5
    river_scale: 0.0
    beach_depth: 0.0
    beach_scale: 0.025
    ridge_mountain: 0.55
    ridge_hills: 0.35
    mountain_depth: 1.0
    mountain_scale: 0.5
    hills_depth: 0.45
    hills_scale: 0.3

  weather:
    - builtin:clear
    - builtin:overcast
    - builtin:rain
    - builtin:thunderstorm

  visuals:
    sky:
      day:
        horizon: [0.64, 0.76, 0.94]
        zenith: [0.26, 0.46, 0.85]
      night:
        horizon: [0.020, 0.030, 0.060]
        zenith: [0.004, 0.007, 0.018]
      twilight_height: 0.35
    sun:
      tilt: 0.0
    moon:
      color: [0.86, 0.90, 1.0]
    stars:
      count: 5120
    clouds: {}

  biome_selector:
    strategy: nearest
    axes: [temperature, humidity]
    weights: [1.0, 1.0]
    entries:
      - biome: builtin:vox2_rainforest
        target: [95, 88]
      - biome: builtin:vox2_marsh
        target: [55, 88]
      - biome: builtin:vox2_seasonal_forest
        target: [85, 70]
      - biome: builtin:vox2_forest
        target: [75, 50]
      - biome: builtin:vox2_taiga
        target: [30, 55]
      - biome: builtin:vox2_plains
        target: [55, 30]
      - biome: builtin:vox2_savanna
        target: [80, 15]
      - biome: builtin:vox2_shrubland
        target: [60, 20]
      - biome: builtin:vox2_desert
        target: [95, 8]
      - biome: builtin:vox2_tundra
        target: [8, 40]

superflat:
  generator: superflat
  spawn: [0, 1, 0]
  weather:
    - builtin:clear
    - builtin:overcast
    - builtin:rain
    - builtin:thunderstorm
  biome_selector:
    strategy: constant
    biome: builtin:vox2_plains
