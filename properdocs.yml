site_name: Voxelius
site_url: https://untodesu.github.io/voxelius
repo_url: https://github.com/untodesu/voxelius
repo_name: untodesu/voxelius
# use_directory_urls: false

plugins:
  - glightbox:
  - minify:
      minify_html: true
  - mkdocs-video:
  - search:

markdown_extensions:
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite:
  - pymdownx.snippets:
  - pymdownx.superfences:

theme:
  name: material
  font: false
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        name: Switch to dark mode
        icon: material/weather-night
      primary: black
      accent: black
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        name: Switch to light mode
        icon: material/weather-sunny
      primary: black
      accent: black
  features:
    - navigation.indexes
    - navigation.path
    - navigation.sections
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.top
  custom_dir: docs/overrides
  favicon: favicon.ico
  logo: favicon.png

hooks:
  - docs/scripts/hooks.py

watch:
  - docs/scripts
  - core
  - shared
  - client
  - server

exclude_docs: |
  /scripts/

extra_css:
  - stylesheets/extra.css

nav:
  - Home: index.md
  - About:
    - History: about/history.md
    - Features: about/features.md
  - Documentation:
    - dev/index.md
    - Engine:
      - Getting Started:
        - Requirements: dev/engine/init-requirements.md
        - Source Hierarchy: dev/engine/init-sources.md
        - Build Guide: dev/engine/init-building.md
        - Editor Setup: dev/engine/init-editor.md
      - Architecture Overview:
        - Core: dev/engine/arch-core.md
        - Input: dev/engine/arch-input.md
        - Rendering: dev/engine/arch-render.md
        - Networking: dev/engine/arch-network.md
        - Sound: dev/engine/arch-sound.md
      - Development:
        - Code Style: dev/engine/dev-code-style.md
        - Contributing: dev/engine/dev-contributing.md
    - Modding:
      - Getting Started:
        - Overview: dev/modding/init-overview.md
        - Mod Metadata: dev/modding/init-modinfo.md
        - Filesystem: dev/modding/init-filesystem.md
      - Engine API:
        - Lua Base: dev/modding/api-lua.md
        - Core: dev/modding/api-core.md
        - Tints: dev/modding/api-tints.md
        - Fluids: dev/modding/api-fluids.md
        - Blocks: dev/modding/api-blocks.md
        - Biomes: dev/modding/api-biomes.md
        - Entities: dev/modding/api-entities.md
        - World: dev/modding/api-world.md
      - File Formats:
        - Block Models: dev/modding/format-bmodel.md
        - Block Collisions: dev/modding/format-bcoll.md
        - Features: dev/modding/format-feature.md
      - Libraries:
        - Fluids: dev/modding/lib-flowdef.md
        - Logs: dev/modding/lib-logdef.md
        - Slabs: dev/modding/lib-slabdef.md
  - Manual:
    - Console:
      - manual/console/index.md
      - Variables: manual/console/variables.md
      - Commands: manual/console/commands.md
